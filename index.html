<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live DoorPrize System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    
    <style>
        body, html {
            height: 100%; margin: 0; font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        .bg-merah-putih {
            background: linear-gradient(135deg, #d32f2f 40%, #ffffff 60%);
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-box {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 900px;
            color: white;
        }

        .login-box { max-width: 400px; }
        .text-emas { color: #FFD700; text-shadow: 2px 2px 5px rgba(0,0,0,0.7); }
        .number-display {
            font-size: 8rem; font-weight: 900; color: #fff;
            letter-spacing: 15px; text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            font-family: 'Courier New', Courier, monospace; margin: 30px 0;
        }

        .d-none { display: none !important; }

        .btn-eye { border-left: none; background-color: white; }
        .input-group .form-control { border-right: none; }
    </style>
</head>
<body class="bg-merah-putih">
    
    <div class="container h-100 d-flex flex-column justify-content-center align-items-center">
        
        <!-- HALAMAN LOGIN -->
        <div id="login-section" class="glass-box login-box text-center p-5 animate__animated animate__fadeIn">
            <h2 class="text-emas fw-bold mb-4">LOGIN DOORPRIZE</h2>
            <div class="mb-3">
                <input type="text" id="username" class="form-control form-control-lg" placeholder="Username">
            </div>
            
            <div class="mb-4 input-group">
                <input type="password" id="password" class="form-control form-control-lg" placeholder="Password">
                <button class="btn btn-outline-secondary btn-eye px-3" type="button" id="togglePassword">👁️</button>
            </div>
            
            <button id="btn-login" class="btn btn-danger btn-lg w-100 fw-bold" onclick="doLogin()">MASUK</button>
        </div>

        <!-- HALAMAN DASHBOARD -->
        <div id="menu-section" class="glass-box text-center p-5 d-none animate__animated animate__zoomIn">
            <h2 class="text-emas fw-bold">DASHBOARD</h2>
            <p class="mb-4">Selamat datang, <b id="user-name-display"></b>! (<span id="user-role-display" class="text-warning"></span>)</p>
            
            <div class="row justify-content-center gap-3">
                <button id="menu-setting" class="btn btn-primary btn-lg col-md-3 d-none" onclick="alert('Fitur Setting')">⚙️ Setting Hadiah</button>
                <button id="menu-undian" class="btn btn-success btn-lg col-md-3 d-none" onclick="openUndian()">🎉 Buka Pengundian</button>
                <button id="menu-live" class="btn btn-info btn-lg col-md-3 text-white" onclick="alert('Fitur Live Monitor')">📺 Live Monitor</button>
            </div>
            <button class="btn btn-outline-light mt-5" onclick="doLogout()">Keluar (Logout)</button>
        </div>

        <!-- HALAMAN PENGUNDIAN -->
        <div id="draw-section" class="glass-box text-center p-5 d-none animate__animated animate__fadeIn">
            <button class="btn btn-sm btn-outline-light position-absolute top-0 start-0 m-3" onclick="backToMenu()">⬅ Kembali</button>
            
            <h1 class="text-emas mb-3" style="font-weight: 900;">GEBYAR JALAN SEHAT</h1>
            <h3 id="current-prize" class="mb-4">Klik START untuk mengundi</h3>
            
            <div class="number-display" id="kupon-display">000000</div>
            
            <div class="controls mt-4">
                <button class="btn btn-success btn-lg mx-2 px-5" id="btn-start" onclick="startDraw()">START</button>
                <button class="btn btn-danger btn-lg mx-2 px-5" id="btn-stop" onclick="stopDraw()" disabled>STOP</button>
                <br>
                <button class="btn btn-outline-light btn-lg mx-2 mt-4" onclick="toggleFullScreen()">FULLSCREEN</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        // ======= GANTI DENGAN URL DEPLOY YANG BARU (NEW DEPLOYMENT) =======
        const API_URL = "https://script.google.com/macros/s/AKfycbwzzsiqhokvVnUyQu4ydbZqJkiJB91pf-btT3MLpaeAD7yHFAr3528hzfeHCdcPe04m/exec"; 

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        async function doLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');

            if(!user || !pass) return Swal.fire('Error', 'Username & Password wajib diisi', 'warning');

            btn.innerText = "Memeriksa...";
            btn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username: user, password: pass })
                });
                const data = await response.json();

                if(data.success) {
                    sessionStorage.setItem('token', data.token);
                    sessionStorage.setItem('role', data.role);
                    sessionStorage.setItem('nama', data.nama);
                    
                    Swal.fire({ title: 'Berhasil Login!', icon: 'success', timer: 1500, showConfirmButton: false });
                    showMenu();
                } else {
                    Swal.fire('Gagal Login', data.message, 'error'); // Pesan error sekarang detail!
                }
            } catch(e) {
                Swal.fire('Error', 'Gagal terhubung ke Apps Script. Pastikan API_URL sudah benar.', 'error');
            }
            btn.innerText = "MASUK";
            btn.disabled = false;
        }

        function showMenu() {
            const role = sessionStorage.getItem('role');
            if(!role) return doLogout(); 

            document.getElementById('login-section').classList.add('d-none');
            document.getElementById('draw-section').classList.add('d-none');
            
            document.getElementById('menu-section').classList.remove('d-none');
            document.getElementById('user-name-display').innerText = sessionStorage.getItem('nama');
            document.getElementById('user-role-display').innerText = role;

            if(role === 'Admin') {
                document.getElementById('menu-setting').classList.remove('d-none');
                document.getElementById('menu-undian').classList.remove('d-none');
            } else if (role === 'Operator') {
                document.getElementById('menu-setting').classList.add('d-none');
                document.getElementById('menu-undian').classList.remove('d-none');
            } else { 
                document.getElementById('menu-setting').classList.add('d-none');
                document.getElementById('menu-undian').classList.add('d-none');
            }
        }

        function openUndian() {
            document.getElementById('menu-section').classList.add('d-none');
            document.getElementById('draw-section').classList.remove('d-none');
        }

        function backToMenu() {
            document.getElementById('draw-section').classList.add('d-none');
            showMenu();
        }

        function doLogout() {
            sessionStorage.clear(); 
            document.getElementById('menu-section').classList.add('d-none');
            document.getElementById('draw-section').classList.add('d-none');
            document.getElementById('login-section').classList.remove('d-none');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        if(sessionStorage.getItem('token')) {
            showMenu();
        }

        let intervalAnimasi;
        let isDrawing = false;

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else if (document.exitFullscreen) document.exitFullscreen();
        }

        function startDraw() {
            isDrawing = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            
            const display = document.getElementById('kupon-display');
            intervalAnimasi = setInterval(() => {
                display.innerText = Math.floor(100000 + Math.random() * 900000).toString();
            }, 50);
        }

        async function stopDraw() {
            if (!isDrawing) return;
            clearInterval(intervalAnimasi);
            document.getElementById('kupon-display').innerText = "MENGUNDI...";

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'draw', 
                        token: sessionStorage.getItem('token') 
                    })
                });
                const data = await response.json();

                if (data.success) {
                    document.getElementById('kupon-display').innerText = data.pemenang.nomor;
                    confetti({ particleCount: 250, spread: 180, origin: { y: 0.6 } });
                    
                    Swal.fire({
                        title: 'SELAMAT!',
                        html: `<h2 class="text-danger fw-bold">${data.pemenang.nama}</h2><br><h4>Memenangkan <b>${data.hadiah}</b></h4>`,
                        icon: 'success',
                        confirmButtonText: 'Lanjutkan Undian'
                    });
                } else {
                    if (data.message.includes("Sesi")) {
                        Swal.fire('Sesi Habis', 'Silakan login kembali.', 'error');
                        doLogout();
                    } else {
                        Swal.fire('Informasi', data.message, 'warning');
                        document.getElementById('kupon-display').innerText = "SELESAI";
                    }
                }
            } catch (error) {
                Swal.fire('Error!', 'Gagal terhubung ke Database Google Sheet.', 'error');
                document.getElementById('kupon-display').innerText = "ERROR";
            }

            isDrawing = false;
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
        }
    </script>
</body>
</html>
