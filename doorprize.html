<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live DoorPrize System</title>
    
    <!-- Memuat Bootstrap 5 untuk Layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Memuat Animate.css untuk Animasi Halus -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    
    <!-- CSS / TAMPILAN -->
    <style>
        body, html {
            height: 100%; 
            margin: 0; 
            overflow: hidden; /* Mencegah scroll saat layar penuh */
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* Tema Merah Putih Animasi */
        .bg-merah-putih {
            background: linear-gradient(135deg, #d32f2f 40%, #ffffff 60%);
            background-size: 200% 200%;
            animation: gradientMove 10s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Efek Glassmorphism (Kaca Transparan) */
        .glass-box {
            background: rgba(0, 0, 0, 0.4); /* Warna dasar agak gelap */
            backdrop-filter: blur(12px);    /* Efek Blur */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 900px;
        }

        .text-emas {
            color: #FFD700;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
            letter-spacing: 2px;
        }

        /* Desain Angka Kupon Undian */
        .number-display {
            font-size: 8rem;
            font-weight: 900;
            color: #fff;
            letter-spacing: 15px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            font-family: 'Courier New', Courier, monospace;
            margin: 30px 0;
        }
        
        /* Responsif untuk Layar Kecil (HP) */
        @media (max-width: 768px) {
            .number-display { font-size: 4rem; letter-spacing: 5px; }
            .btn-lg { padding: 10px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body class="bg-merah-putih">
    
    <div class="container h-100 d-flex flex-column justify-content-center align-items-center">
        <!-- Area Glassmorphism -->
        <div class="glass-box text-center p-5 w-100 animate__animated animate__zoomIn">
            <h1 class="text-emas mb-3" style="font-weight: 900;">GEBYAR JALAN SEHAT</h1>
            <h3 id="current-prize" class="text-white mb-4">Hadiah: Siap Diundi...</h3>
            
            <!-- Tempat Angka Bergerak -->
            <div class="number-display" id="kupon-display">000000</div>
            
            <!-- Panel Tombol -->
            <div class="controls mt-4" id="control-panel">
                <button class="btn btn-success btn-lg mx-2 px-5" id="btn-start">START</button>
                <button class="btn btn-danger btn-lg mx-2 px-5" id="btn-stop" disabled>STOP</button>
                <br>
                <button class="btn btn-outline-light btn-lg mx-2 mt-4" onclick="toggleFullScreen()">FULLSCREEN</button>
            </div>
        </div>
    </div>

    <!-- Memuat Library Pop-up Cantik (SweetAlert2) & Animasi Kertas (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- JAVASCRIPT / LOGIKA APLIKASI -->
    <script>
        // MASUKKAN URL DEPLOY APPS SCRIPT ANDA DI SINI NANTI
        const API_URL = "https://script.google.com/macros/s/AKfycbwzzsiqhokvVnUyQu4ydbZqJkiJB91pf-btT3MLpaeAD7yHFAr3528hzfeHCdcPe04m/exec"; 
        
        let intervalAnimasi;
        let isDrawing = false;

        // Hubungkan tombol dengan fungsinya
        document.getElementById('btn-start').addEventListener('click', startDraw);
        document.getElementById('btn-stop').addEventListener('click', stopDraw);

        // Fungsi Layar Penuh
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // Fungsi Mulai Undi
        function startDraw() {
            isDrawing = true;
            document.getElementById('btn-start').disabled = true;
            document.getElementById('btn-stop').disabled = false;
            
            const display = document.getElementById('kupon-display');
            
            // Membuat efek angka acak berjalan sangat cepat di layar
            intervalAnimasi = setInterval(() => {
                // Mengacak angka 6 digit (dari 100000 sampai 999999)
                display.innerText = Math.floor(100000 + Math.random() * 900000).toString();
            }, 50); // Kecepatan putaran: 50 milidetik
        }

        // Fungsi Berhenti (Panggil Database)
        async function stopDraw() {
            if (!isDrawing) return;
            
            // Hentikan efek angka berjalan
            clearInterval(intervalAnimasi);
            document.getElementById('kupon-display').innerText = "MENGUNDI...";

            try {
                // Mengirim perintah ke Google Apps Script (Backend)
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'draw', 
                        token: sessionStorage.getItem('token') // Mengambil token login
                    })
                });
                const data = await response.json();

                if (data.success) {
                    // Jika sukses mengambil pemenang, tampilkan nomornya
                    document.getElementById('kupon-display').innerText = data.pemenang.nomor;
                    
                    // Munculkan efek Confetti (Kertas warna-warni jatuh)
                    confetti({ 
                        particleCount: 250, 
                        spread: 180, 
                        origin: { y: 0.6 } 
                    });
                    
                    // Munculkan Pop-up Pemenang
                    Swal.fire({
                        title: 'SELAMAT!',
                        html: `<h2 class="text-danger fw-bold">${data.pemenang.nama}</h2><br><h4>Memenangkan <b>${data.hadiah}</b></h4>`,
                        icon: 'success',
                        confirmButtonText: 'Lanjutkan Undian'
                    });
                } else {
                    // Jika hadiah habis atau terjadi error logic dari Apps Script
                    Swal.fire('Informasi', data.message, 'warning');
                    document.getElementById('kupon-display').innerText = "SELESAI";
                }
            } catch (error) {
                // Jika koneksi internet putus / URL salah
                Swal.fire('Error!', 'Gagal terhubung ke Database Google Sheet. Pastikan URL API sudah benar.', 'error');
                document.getElementById('kupon-display').innerText = "ERROR";
            }

            // Kembalikan status tombol
            isDrawing = false;
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
        }
    </script>
</body>
</html>
